name: Deploy to cPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, curl, fileinfo, pdo, pdo_mysql, bcmath
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Discover live Laravel directory
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_PORT: ${{ secrets.FTPS_PORT }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 <<'PY'
          import ftplib
          import os
          import posixpath
          import ssl
          from collections import deque

          ftp = ftplib.FTP_TLS(context=ssl._create_unverified_context())
          ftp.connect(os.environ['FTP_HOST'], int(os.environ['FTP_PORT']), timeout=30)
          ftp.login(os.environ['FTP_USER'], os.environ['FTP_PASSWORD'])
          ftp.prot_p()

          skipped = {'.git', 'node_modules', 'storage', 'vendor', 'TGworld'}
          queue = deque([('/', 0)])
          visited = set()
          matches = []

          def list_entries(path):
              previous = ftp.pwd()
              try:
                  ftp.cwd(path)
                  return list(ftp.mlsd())
              finally:
                  ftp.cwd(previous)

          def file_exists(path):
              try:
                  ftp.voidcmd('TYPE I')
                  ftp.size(path)
                  return True
              except ftplib.all_errors:
                  return False

          while queue and len(visited) < 250:
              path, depth = queue.popleft()
              if path in visited:
                  continue
              visited.add(path)

              try:
                  entries = list_entries(path)
              except ftplib.all_errors:
                  continue

              names = {name: facts.get('type') for name, facts in entries}
              if (
                  names.get('app') == 'dir'
                  and names.get('public') == 'dir'
                  and 'artisan' in names
                  and '.env' in names
                  and file_exists(posixpath.join(path, 'app/Filament/Resources/CarResource.php'))
              ):
                  matches.append(path)

              if depth >= 5:
                  continue

              for name, entry_type in names.items():
                  if entry_type != 'dir' or name in skipped or name.startswith('.'):
                      continue
                  queue.append((posixpath.join(path, name), depth + 1))

          ftp.quit()

          if len(matches) != 1:
              raise SystemExit(f'Expected exactly one live TG World Laravel directory; found {len(matches)}.')

          live_dir = matches[0].rstrip('/') + '/'
          print(f'::add-mask::{live_dir}')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env_file:
              env_file.write(f'FTP_LARAVEL_DIR={live_dir}\n')
          PY

      - name: Prepare application release
        run: |
          mkdir -p \
            .deploy-release/app/Http/Controllers/Api \
            .deploy-release/app/Http/Middleware \
            .deploy-release/app/Mail \
            .deploy-release/app/Models \
            .deploy-release/app/Services \
            .deploy-release/app/Filament/Resources \
            .deploy-release/app/Providers/Filament \
            .deploy-release/app/Providers \
            .deploy-release/bootstrap \
            .deploy-release/config \
            .deploy-release/database/migrations \
            .deploy-release/resources/views/emails \
            .deploy-release/resources/views/filament/hooks \
            .deploy-release/resources/views/filament/tables \
            .deploy-release/routes

          cp app/Http/Controllers/Api/AuthController.php .deploy-release/app/Http/Controllers/Api/
          cp app/Http/Middleware/AuthenticateCustomerSession.php .deploy-release/app/Http/Middleware/
          cp app/Http/Middleware/VerifyFrontendOrigin.php .deploy-release/app/Http/Middleware/
          cp app/Mail/PasswordResetMail.php .deploy-release/app/Mail/
          cp app/Models/AuthSession.php .deploy-release/app/Models/
          cp app/Models/Client.php .deploy-release/app/Models/
          cp app/Models/PasswordResetToken.php .deploy-release/app/Models/
          cp app/Services/AuthSessionService.php .deploy-release/app/Services/
          cp app/Providers/AppServiceProvider.php .deploy-release/app/Providers/
          cp bootstrap/app.php .deploy-release/bootstrap/
          cp config/app.php config/auth.php config/cors.php config/session.php .deploy-release/config/
          cp database/migrations/2026_09_03_000001_create_customer_auth_tables.php .deploy-release/database/migrations/
          cp database/migrations/2026_09_03_000002_repair_production_users_schema.php .deploy-release/database/migrations/
          cp resources/views/emails/password-reset.blade.php .deploy-release/resources/views/emails/
          cp routes/api.php .deploy-release/routes/
          cp app/Filament/Resources/CarResource.php .deploy-release/app/Filament/Resources/
          cp app/Filament/Resources/ContentResource.php .deploy-release/app/Filament/Resources/
          cp app/Filament/Resources/OrderResource.php .deploy-release/app/Filament/Resources/
          cp app/Filament/Resources/PromotionResource.php .deploy-release/app/Filament/Resources/
          cp app/Filament/Resources/SoldCarResource.php .deploy-release/app/Filament/Resources/
          cp app/Providers/Filament/AdminPanelProvider.php .deploy-release/app/Providers/Filament/
          cp resources/views/filament/hooks/car-mobile-cards-styles.blade.php \
            .deploy-release/resources/views/filament/hooks/
          cp resources/views/filament/tables/*-mobile-card.blade.php \
            .deploy-release/resources/views/filament/tables/

      - name: Deploy application release via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTPS_PORT }}
          protocol: ftps
          timeout: 600000
          log-level: verbose
          local-dir: .deploy-release/
          server-dir: ${{ env.FTP_LARAVEL_DIR }}
          state-name: .ftp-mobile-cards-state.json

      - name: Prepare one-time deployment runner
        run: |
          deploy_token="$(openssl rand -hex 32)"
          echo "::add-mask::$deploy_token"
          echo "DEPLOY_RUNNER_TOKEN=$deploy_token" >> "$GITHUB_ENV"
          mkdir -p .deploy-runner
          cp .github/deploy/run-release.php .deploy-runner/run-release.php
          DEPLOY_RUNNER_TOKEN="$deploy_token" php -r '
              $path = ".deploy-runner/run-release.php";
              $contents = file_get_contents($path);
              file_put_contents($path, str_replace("__DEPLOY_TOKEN__", getenv("DEPLOY_RUNNER_TOKEN"), $contents));
          '

      - name: Upload one-time deployment runner
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTPS_PORT }}
          protocol: ftps
          timeout: 600000
          log-level: minimal
          local-dir: .deploy-runner/
          server-dir: ${{ env.FTP_LARAVEL_DIR }}public/
          state-name: .ftp-release-runner-state.json

      - name: Run database migrations
        run: |
          response="$(curl --silent --show-error \
            "https://tgworld.e-saloon.online/public/run-release.php?token=$DEPLOY_RUNNER_TOKEN")"
          echo "$response"
          test "$response" = 'RELEASE_OK'

      - name: Verify authentication route
        run: |
          status="$(curl --silent --output /tmp/auth-me.json --write-out '%{http_code}' \
            -H 'Accept: application/json' \
            'https://tgworld.e-saloon.online/api/auth/me')"
          test "$status" = '401'
          grep -q 'UNAUTHENTICATED' /tmp/auth-me.json

      - name: Prepare one-time customer reset
        if: contains(github.event.head_commit.message, '[clear customers once]')
        run: |
          clear_token="$(openssl rand -hex 32)"
          echo "::add-mask::$clear_token"
          echo "CLEAR_CUSTOMERS_TOKEN=$clear_token" >> "$GITHUB_ENV"
          mkdir -p .clear-customers
          cp .github/deploy/clear-customers.php .clear-customers/clear-customers.php
          CLEAR_CUSTOMERS_TOKEN="$clear_token" php -r '
              $path = ".clear-customers/clear-customers.php";
              $contents = file_get_contents($path);
              file_put_contents($path, str_replace("__DEPLOY_TOKEN__", getenv("CLEAR_CUSTOMERS_TOKEN"), $contents));
          '

      - name: Upload one-time customer reset
        if: contains(github.event.head_commit.message, '[clear customers once]')
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTPS_PORT }}
          protocol: ftps
          timeout: 600000
          log-level: minimal
          local-dir: .clear-customers/
          server-dir: ${{ env.FTP_LARAVEL_DIR }}public/
          state-name: .ftp-clear-customers-state.json

      - name: Clear production customers
        if: contains(github.event.head_commit.message, '[clear customers once]')
        run: |
          response="$(curl --silent --show-error --fail \
            "https://tgworld.e-saloon.online/public/clear-customers.php?token=$CLEAR_CUSTOMERS_TOKEN")"
          echo "$response"
          echo "$response" | grep -q '"users": 0'
