name: Deploy to cPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, curl, fileinfo, pdo, pdo_mysql, bcmath
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Discover live Laravel directory
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_PORT: ${{ secrets.FTPS_PORT }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 <<'PY'
          import ftplib
          import os
          import posixpath
          import ssl
          from collections import deque

          ftp = ftplib.FTP_TLS(context=ssl._create_unverified_context())
          ftp.connect(os.environ['FTP_HOST'], int(os.environ['FTP_PORT']), timeout=30)
          ftp.login(os.environ['FTP_USER'], os.environ['FTP_PASSWORD'])
          ftp.prot_p()

          skipped = {'.git', 'node_modules', 'storage', 'vendor', 'TGworld'}
          queue = deque([('/', 0)])
          visited = set()
          matches = []

          def list_entries(path):
              previous = ftp.pwd()
              try:
                  ftp.cwd(path)
                  return list(ftp.mlsd())
              finally:
                  ftp.cwd(previous)

          def file_exists(path):
              try:
                  ftp.voidcmd('TYPE I')
                  ftp.size(path)
                  return True
              except ftplib.all_errors:
                  return False

          while queue and len(visited) < 250:
              path, depth = queue.popleft()
              if path in visited:
                  continue
              visited.add(path)

              try:
                  entries = list_entries(path)
              except ftplib.all_errors:
                  continue

              names = {name: facts.get('type') for name, facts in entries}
              if (
                  names.get('app') == 'dir'
                  and names.get('public') == 'dir'
                  and 'artisan' in names
                  and '.env' in names
                  and file_exists(posixpath.join(path, 'app/Filament/Resources/CarResource.php'))
              ):
                  matches.append(path)

              if depth >= 5:
                  continue

              for name, entry_type in names.items():
                  if entry_type != 'dir' or name in skipped or name.startswith('.'):
                      continue
                  queue.append((posixpath.join(path, name), depth + 1))

          ftp.quit()

          if len(matches) != 1:
              raise SystemExit(f'Expected exactly one live TG World Laravel directory; found {len(matches)}.')

          live_dir = matches[0].rstrip('/') + '/'
          print(f'::add-mask::{live_dir}')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env_file:
              env_file.write(f'FTP_LARAVEL_DIR={live_dir}\n')
          PY

      - name: Prepare mobile card release
        run: |
          mkdir -p \
            .deploy-release/app/Filament/Resources \
            .deploy-release/app/Providers/Filament \
            .deploy-release/resources/views/filament/hooks \
            .deploy-release/resources/views/filament/tables

          cp app/Filament/Resources/CarResource.php .deploy-release/app/Filament/Resources/
          cp app/Filament/Resources/ContentResource.php .deploy-release/app/Filament/Resources/
          cp app/Filament/Resources/OrderResource.php .deploy-release/app/Filament/Resources/
          cp app/Filament/Resources/PromotionResource.php .deploy-release/app/Filament/Resources/
          cp app/Filament/Resources/SoldCarResource.php .deploy-release/app/Filament/Resources/
          cp app/Providers/Filament/AdminPanelProvider.php .deploy-release/app/Providers/Filament/
          cp resources/views/filament/hooks/car-mobile-cards-styles.blade.php \
            .deploy-release/resources/views/filament/hooks/
          cp resources/views/filament/tables/*-mobile-card.blade.php \
            .deploy-release/resources/views/filament/tables/

      - name: Deploy mobile card release via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTPS_PORT }}
          protocol: ftps
          timeout: 600000
          log-level: verbose
          local-dir: .deploy-release/
          server-dir: ${{ env.FTP_LARAVEL_DIR }}
          state-name: .ftp-mobile-cards-state.json

      - name: Prepare live cache clearer
        run: |
          cache_token="$(openssl rand -hex 32)"
          echo "::add-mask::$cache_token"
          echo "CACHE_CLEAR_TOKEN=$cache_token" >> "$GITHUB_ENV"

          mkdir -p .deploy-cache-clear

          cat > .deploy-cache-clear/deploy-cache-clear.php <<'PHP'
          <?php

          declare(strict_types=1);

          header('Content-Type: text/plain; charset=UTF-8');

          if (! hash_equals('__CACHE_TOKEN__', (string) ($_GET['token'] ?? ''))) {
              http_response_code(404);
              echo 'NOT_FOUND';
              exit;
          }

          register_shutdown_function(static function (): void {
              @unlink(__FILE__);
              @unlink(__DIR__.'/.deploy-cache-clear.php');
              @unlink(__DIR__.'/.ftp-cache-clear-state.json');
          });

          require __DIR__.'/../vendor/autoload.php';

          $app = require_once __DIR__.'/../bootstrap/app.php';
          $kernel = $app->make(Illuminate\Contracts\Console\Kernel::class);
          $kernel->bootstrap();

          $laravelExitCode = $kernel->call('optimize:clear');
          $filamentExitCode = $kernel->call('filament:optimize-clear');

          if ($laravelExitCode !== 0 || $filamentExitCode !== 0) {
              http_response_code(500);
              echo 'CACHE_CLEAR_FAILED';
              exit;
          }

          echo 'CACHE_CLEAR_OK';
          PHP

          CACHE_CLEAR_TOKEN="$cache_token" php -r '
              $path = ".deploy-cache-clear/deploy-cache-clear.php";
              $contents = file_get_contents($path);
              file_put_contents($path, str_replace("__CACHE_TOKEN__", getenv("CACHE_CLEAR_TOKEN"), $contents));
          '

      - name: Upload live cache clearer
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTPS_PORT }}
          protocol: ftps
          timeout: 600000
          log-level: minimal
          local-dir: .deploy-cache-clear/
          server-dir: ${{ env.FTP_LARAVEL_DIR }}public/
          state-name: .ftp-cache-clear-state.json

      - name: Clear live Laravel and Filament caches
        run: |
          response="$(curl --silent --show-error --fail --retry 3 --retry-delay 2 \
            "https://tgworld.e-saloon.online/deploy-cache-clear.php?token=$CACHE_CLEAR_TOKEN")"

          test "$response" = 'CACHE_CLEAR_OK'
