name: Deploy to cPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, curl, fileinfo, pdo, pdo_mysql, bcmath
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTPS_PORT }}
          protocol: ftps
          timeout: 600000
          log-level: verbose
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          exclude: |
            **/.git*
            **/.github/**
            **/node_modules/**
            **/vendor/**
            **/tests/**
            **/.env
            **/.env.*
            **/storage/logs/**
            **/storage/framework/cache/data/**
            **/storage/framework/sessions/**
            **/storage/framework/views/**
            **/public/TGworld/**
            **/README.md
            **/phpunit.xml
            **/.editorconfig

      - name: Prepare live cache clearer
        run: |
          cache_token="$(openssl rand -hex 32)"
          echo "::add-mask::$cache_token"
          echo "CACHE_CLEAR_TOKEN=$cache_token" >> "$GITHUB_ENV"

          mkdir -p .deploy-cache-clear

          cat > .deploy-cache-clear/.deploy-cache-clear.php <<'PHP'
          <?php

          declare(strict_types=1);

          header('Content-Type: text/plain; charset=UTF-8');

          if (! hash_equals('__CACHE_TOKEN__', (string) ($_GET['token'] ?? ''))) {
              http_response_code(404);
              echo 'NOT_FOUND';
              exit;
          }

          register_shutdown_function(static function (): void {
              @unlink(__FILE__);
          });

          require __DIR__.'/../vendor/autoload.php';

          $app = require_once __DIR__.'/../bootstrap/app.php';
          $kernel = $app->make(Illuminate\Contracts\Console\Kernel::class);
          $kernel->bootstrap();

          $laravelExitCode = $kernel->call('optimize:clear');
          $filamentExitCode = $kernel->call('filament:optimize-clear');

          if ($laravelExitCode !== 0 || $filamentExitCode !== 0) {
              http_response_code(500);
              echo 'CACHE_CLEAR_FAILED';
              exit;
          }

          echo 'CACHE_CLEAR_OK';
          PHP

          CACHE_CLEAR_TOKEN="$cache_token" php -r '
              $path = ".deploy-cache-clear/.deploy-cache-clear.php";
              $contents = file_get_contents($path);
              file_put_contents($path, str_replace("__CACHE_TOKEN__", getenv("CACHE_CLEAR_TOKEN"), $contents));
          '

      - name: Upload live cache clearer
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTPS_PORT }}
          protocol: ftps
          timeout: 600000
          log-level: minimal
          local-dir: .deploy-cache-clear/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}/public/
          state-name: .ftp-cache-clear-state.json

      - name: Clear live Laravel and Filament caches
        run: |
          response="$(curl --silent --show-error --fail --retry 3 --retry-delay 2 \
            "https://tgworld.e-saloon.online/.deploy-cache-clear.php?token=$CACHE_CLEAR_TOKEN")"

          test "$response" = 'CACHE_CLEAR_OK'
