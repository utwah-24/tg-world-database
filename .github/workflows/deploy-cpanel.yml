name: Deploy to cPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, curl, fileinfo, pdo, pdo_mysql, bcmath
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTPS_PORT }}
          protocol: ftps
          timeout: 600000
          log-level: verbose
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          exclude: |
            **/.git*
            **/.github/**
            **/node_modules/**
            **/vendor/**
            **/tests/**
            **/.env
            **/.env.*
            **/storage/logs/**
            **/storage/framework/cache/data/**
            **/storage/framework/sessions/**
            **/storage/framework/views/**
            **/public/TGworld/**
            **/README.md
            **/phpunit.xml
            **/.editorconfig

      - name: Clear live Laravel and Filament caches
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_PORT: ${{ secrets.FTPS_PORT }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          cache_file="deploy-cache-clear-$(openssl rand -hex 24).php"
          cache_script="$(mktemp)"
          trap 'rm -f "$cache_script"' EXIT

          echo "::add-mask::$cache_file"

          cat > "$cache_script" <<'PHP'
          <?php

          declare(strict_types=1);

          header('Content-Type: text/plain; charset=UTF-8');

          register_shutdown_function(static function (): void {
              @unlink(__FILE__);
          });

          require __DIR__.'/../vendor/autoload.php';

          $app = require_once __DIR__.'/../bootstrap/app.php';
          $kernel = $app->make(Illuminate\Contracts\Console\Kernel::class);
          $kernel->bootstrap();

          $laravelExitCode = $kernel->call('optimize:clear');
          $filamentExitCode = $kernel->call('filament:optimize-clear');

          if ($laravelExitCode !== 0 || $filamentExitCode !== 0) {
              http_response_code(500);
              echo 'CACHE_CLEAR_FAILED';
              exit;
          }

          echo 'CACHE_CLEAR_OK';
          PHP

          remote_dir="${FTP_REMOTE_DIR#/}"
          remote_dir="${remote_dir%/}"

          curl --silent --show-error --fail \
            --ssl-reqd \
            --ftp-pasv \
            --user "$FTP_USER:$FTP_PASSWORD" \
            --upload-file "$cache_script" \
            "ftp://$FTP_HOST:$FTP_PORT/$remote_dir/public/$cache_file"

          response="$(curl --silent --show-error --fail --retry 3 --retry-delay 2 \
            "https://tgworld.e-saloon.online/$cache_file")"

          test "$response" = 'CACHE_CLEAR_OK'
